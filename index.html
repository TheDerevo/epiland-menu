<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Epiland Меню</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #1e293b;
        }

        /* Фіолетова фірмова шапка */
        .header {
            background-color: #4c1d95; 
            width: 100%;
            padding: 22px 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(76, 29, 149, 0.2);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Контейнер для списку кнопок */
        .menu-container {
            width: 90%;
            max-width: 400px;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Загальний стиль кнопок */
        .menu-btn, .menu-link {
            width: 100%;
            padding: 18px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 16px;
            border: 2px solid #4c1d95;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            transition: all 0.2s ease;
            box-sizing: border-box;
            letter-spacing: 0.5px;
            text-decoration: none; /* Для посилань-кнопок */
        }

        /* Головні фіолетові кнопки */
        .btn-primary {
            background-color: #4c1d95;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(76, 29, 149, 0.15);
        }

        /* Стандартні білі кнопки */
        .btn-secondary {
            background-color: #ffffff;
            color: #4c1d95;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        /* Ефект натискання */
        .menu-btn:active, .menu-link:active {
            transform: scale(0.97);
            opacity: 0.95;
        }

        .icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🎉 Epiland 🎉</div>
    </div>

    <div class="menu-container">

        <button class="menu-btn btn-primary" onclick="startAnketa()">
            <span class="icon">🎉</span> ЗАМОВИТИ СВЯТО
        </button>

        <a href="faq.html" class="menu-link btn-secondary">
            <span class="icon">❓</span> ПОПУЛЯРНІ ЗАПИТАННЯ
        </a>

        <button class="menu-btn btn-secondary" onclick="clickBtn('Атракціони')">
            <span class="icon">🎡</span> АТРАКЦІОНИ
        </button>

        <button class="menu-btn btn-secondary" onclick="clickBtn('Кафе')">
            <span class="icon">☕</span> КАФЕ
        </button>

        <button class="menu-btn btn-secondary" onclick="clickBtn('Про нас')">
            <span class="icon">ℹ️</span> ПРО НАС
        </button>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function startAnketa() {
            tg.sendData("замовити_свято_через_веб");
            tg.close();
        }

        function clickBtn(name) {
            alert("Ви обрали розділ: " + name);
        }
    </script>

</body>
</html>
